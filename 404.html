<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Redirecionando… | Dias Pires Advocacia</title>
    <meta name="robots" content="noindex" />
    <script>
      (function () {
        var route = window.location.pathname + window.location.search + window.location.hash;
        try {
          sessionStorage.setItem("spa:redirect", route);
        } catch (e) {}
        window.location.replace("/");
      })();
    </script>
  </head>
  <body>
    <p>Redirecionando…</p>
  </body>
</html>
